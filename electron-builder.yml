appId: com.videoanalyst.app
productName: Video Analyst
publish: never
directories:
  output: dist
files:
  - dist-electron/**/*
  - dist/**/*
  - resources/**/*
mac:
  icon: resources/icons/icon.png
  category: public.app-category.productivity
win:
  icon: resources/icons/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - ia32
linux:
  icon: resources/icons/icon.png
  target:
    - AppImage
    - deb
