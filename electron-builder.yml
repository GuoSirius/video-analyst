appId: com.videoanalyst.app
productName: Video Analyst
directories:
  output: dist
files:
  - dist-electron/**/*
  - dist/**/*
  - resources/**/*
publish:
  provider: github
  owner: GuoSirius
  repo: video-analyst
mac:
  icon: resources/icons/icon.png
  category: public.app-category.productivity
win:
  icon: resources/icons/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
linux:
  icon: resources/icons/icon.png
  target:
    - AppImage
    - deb
