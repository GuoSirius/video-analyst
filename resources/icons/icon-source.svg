<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景渐变：深紫色到蓝色 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <!-- 播放按钮渐变 -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <!-- 声波渐变 -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#C7D2FE;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- 主圆形背景（带圆角效果） -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)"/>
  
  <!-- 中心播放按钮（代表视频/音频） -->
  <polygon points="210,180 210,332 350,256" fill="url(#playGrad)"/>
  
  <!-- 左侧声波符号（代表音频） -->
  <rect x="130" y="200" width="14" height="112" rx="7" fill="url(#waveGrad)"/>
  <rect x="152" y="220" width="14" height="72" rx="7" fill="url(#waveGrad)" opacity="0.8"/>
  <rect x="174" y="210" width="14" height="92" rx="7" fill="url(#waveGrad)" opacity="0.9"/>
  
  <!-- 右侧文字线条（代表转文字） -->
  <rect x="370" y="220" width="36" height="10" rx="5" fill="#FFFFFF" opacity="0.95"/>
  <rect x="370" y="245" width="32" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="370" y="270" width="36" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="370" y="295" width="28" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- 底部装饰：分析符号 -->
  <circle cx="256" cy="380" r="24" fill="#FFFFFF" opacity="0.15"/>
  <path d="M238 380 L248 368 L268 388 L282 362" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>