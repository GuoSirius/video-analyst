name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  REPO_URL: https://github.com/GuoSirius/video-analyst

jobs:
  # ============================================================
  # 构建任务 - 多平台并行构建
  # ============================================================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows-installer
          - os: ubuntu-latest
            target: --linux AppImage
            artifact: linux-appimage
          - os: macos-latest
            target: --mac
            artifact: macos-dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Linux 系统依赖
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libasound2t64 libxtst6 libayatana-appindicator3-dev \
            libdrm2 libgbm1 libxshmfence1 fakeroot rpm

      # 安装依赖
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install native dependencies
        run: npx electron-builder install-app-deps

      # 构建
      - name: Build application
        env:
          NODE_ENV: production
        run: npm run build

      # 打包
      - name: Package installers
        run: npx electron-builder ${{ matrix.target }} --publish never

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/*-mac.zip
            dist/*.tar.gz
          if-no-files-found: warn

  # ============================================================
  # 发布任务 - 仅在 tag 推送时执行
  # ============================================================
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ============================================================
      # 生成 Release Notes - 仅包含当前版本的所有提交
      # ============================================================
      - name: Generate Release Notes
        id: release-notes
        run: |
          set -e

          # 当前版本号（去除 v 前缀）
          CURRENT_TAG="${GITHUB_REF#refs/tags/v}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "Current: $CURRENT_TAG"
          echo "Previous: $PREV_TAG"

          # 获取当前版本的所有提交（排除 chore(release)）
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD^ --pretty=format:"%s|%h" --invert-grep --grep="chore(release)")
          else
            COMMITS=$(git log --pretty=format:"%s|%h" --invert-grep --grep="chore(release)")
          fi

          # 初始化分组
          declare -A groups
          groups[feat]=""; groups[fix]=""; groups[perf]=""
          groups[refactor]=""; groups[docs]=""; groups[build]=""
          groups[ci]=""; groups[chore]=""; groups[other]=""

          # 按类型分类提交
          while IFS='|' read -r subject hash; do
            [ -z "$subject" ] && continue
            commit_url="[${hash}](${REPO_URL}/commit/${hash})"

            if [[ "$subject" =~ ^feat(\(.+\))?: ]]; then
              desc="${subject#feat*:* }"
              groups[feat]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^fix(\(.+\))?: ]]; then
              desc="${subject#fix*:* }"
              groups[fix]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^perf(\(.+\))?: ]]; then
              desc="${subject#perf*:* }"
              groups[perf]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^refactor(\(.+\))?: ]]; then
              desc="${subject#refactor*:* }"
              groups[refactor]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^docs(\(.+\))?: ]]; then
              desc="${subject#docs*:* }"
              groups[docs]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^build(\(.+\))?: ]]; then
              desc="${subject#build*:* }"
              groups[build]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^ci(\(.+\))?: ]]; then
              desc="${subject#ci*:* }"
              groups[ci]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^chore(\(.+\))?: ]]; then
              desc="${subject#chore*:* }"
              groups[chore]+="- ${desc} ${commit_url}\n"
            else
              groups[other]+="- ${subject} ${commit_url}\n"
            fi
          done <<< "$COMMITS"

          # 构建 Release Notes
          CHANGELOG="## What's Changed\n\n"

          add_section() {
            local key=$1; local title=$2
            [ -n "${groups[$key]}" ] && CHANGELOG+="### ${title}\n\n${groups[$key]}\n"
          }

          add_section "feat" "✨ Features"
          add_section "fix" "🐛 Bug Fixes"
          add_section "perf" "⚡ Performance"
          add_section "refactor" "🔄 Refactoring"
          add_section "docs" "📝 Documentation"
          add_section "build" "📦 Build System"
          add_section "ci" "🔧 CI/CD"
          add_section "chore" "🔧 Chores"
          add_section "other" "📋 Other"

          # 无内容时提示
          if [ "${groups[feat]}${groups[fix]}${groups[perf]}${groups[refactor]}${groups[docs]}${groups[build]}${groups[ci]}${groups[chore]}${groups[other]}" == "" ]; then
            CHANGELOG+="- No functional changes in this release\n"
          fi

          CHANGELOG+="\n---\n\n**Full Changelog**: ${REPO_URL}/compare/${PREV_TAG:-0.0.0}...${CURRENT_TAG}"

          # 输出到 GitHub Actions
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: ${{ steps.release-notes.outputs.changelog }}
          files: |
            artifacts/windows-installer/**/*.exe
            artifacts/linux-appimage/*.AppImage
            artifacts/macos-dmg/*.dmg
            artifacts/macos-dmg/*-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
