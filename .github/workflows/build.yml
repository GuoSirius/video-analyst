name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: nsis
            artifact_name: windows-installer
          - os: ubuntu-latest
            target: AppImage
            artifact_name: linux-appimage
          - os: macos-latest
            target: dmg
            artifact_name: macos-dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug - Node version
        run: node --version && npm --version

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify4-dev libnss3 libxss1 libasound2 libxtst6 xdg-utils libatspi2.0-dev libdrm2 libgbm1

      - name: Install dependencies
        run: npm ci

      - name: Debug - npm list
        run: npm list --depth=0

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Debug - Build output
        run: |
          echo "=== dist folder ===" && ls -la dist/ 2>/dev/null || echo "dist not found"
          echo "=== dist-electron folder ===" && ls -la dist-electron/ 2>/dev/null || echo "dist-electron not found"

      - name: Build installers
        run: |
          echo "=== Building ${{ matrix.target }} ===" && npx electron-builder --${{ matrix.target }}

      - name: Debug - Artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.sha }}
          release_name: Build ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
