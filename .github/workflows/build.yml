name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: --win
            artifact_name: windows-installer
          - os: ubuntu-latest
            build_cmd: --linux AppImage
            artifact_name: linux-appimage
          - os: macos-latest
            build_cmd: --mac
            artifact_name: macos-dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            libayatana-appindicator3-dev \
            libdrm2 \
            libgbm1 \
            libxshmfence1 \
            fakeroot \
            rpm

      - name: Install dependencies
        run: |
          echo "=== npm install (skip postinstall) ===" && npm install --ignore-scripts

      - name: Install native deps
        run: npx electron-builder install-app-deps

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Build installers (macOS)
        if: matrix.os == 'macos-latest'
        env:
          # CI 环境使用官方 electron-builder 镜像，避免 npmmirror 缺失文件
          # ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          # ELECTRON_BUILDER_BINARY_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npx electron-builder ${{ matrix.build_cmd }} --publish never

      - name: Build installers (others)
        if: matrix.os != 'macos-latest'
        run: npx electron-builder ${{ matrix.build_cmd }} --publish never

      - name: Debug - Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          echo "=== dist folder ===" && ls -la dist/ 2>&1 || echo "dist not found"
          echo "=== dist-electron folder ===" && ls -la dist-electron/ 2>&1 || echo "dist-electron not found"

      - name: Debug - Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "=== dist folder ===" && Get-ChildItem dist/ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          echo "=== dist-electron folder ===" && Get-ChildItem dist-electron/ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/*-mac.zip
            dist/*.tar.gz
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/windows-installer/**/*.exe
            artifacts/linux-appimage/*.AppImage
            artifacts/macos-dmg/*.dmg
            artifacts/macos-dmg/*-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
