name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: ubuntu-latest
            target: --linux AppImage
            artifact: linux
          - os: macos-latest
            target: --mac
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libasound2t64 libxtst6 libayatana-appindicator3-dev \
            libdrm2 libgbm1 libxshmfence1 fakeroot rpm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: |
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/*-mac.zip
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version range
        id: version-info
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF#refs/tags/v}"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_OUTPUT

          # 获取上一个 tag（排除当前版本）
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          echo "PREV_TAG=${PREV_TAG:-0.0.0}" >> $GITHUB_OUTPUT

          # 获取当前版本所有提交（排除版本发布提交）
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "RANGE=$RANGE" >> $GITHUB_OUTPUT

      - name: Generate Release Notes (Categorized)
        id: release-body
        run: |
          set -euo pipefail
          shopt -s extglob

          CURRENT_TAG="${{ steps.version-info.outputs.CURRENT_TAG }}"
          PREV_TAG="${{ steps.version-info.outputs.PREV_TAG }}"
          RANGE="${{ steps.version-info.outputs.RANGE }}"

          REPO_URL="https://github.com/GuoSirius/video-analyst"

          # 获取并分类提交
          FEATS=""; FIXES=""; PERFS=""; REFS=""; DOCS=""
          STYLES=""; TESTS=""; BUILDS=""; CIS=""; CHORES=""; OTHERS=""

          while IFS='|' read -r subject hash; do
            [ -z "$subject" ] && continue
            commit_url="[\`${hash}\`](${REPO_URL}/commit/${hash})"
            desc="${subject#*:* }"

            case "$subject" in
              feat\(*\)*|feat:*)
                FEATS="${FEATS}- ${desc} ${commit_url}\n"
                ;;
              fix\(*\)*|fix:*)
                FIXES="${FIXES}- ${desc} ${commit_url}\n"
                ;;
              perf\(*\)*|perf:*)
                PERFS="${PERFS}- ${desc} ${commit_url}\n"
                ;;
              refactor\(*\)*|refactor:*)
                REFS="${REFS}- ${desc} ${commit_url}\n"
                ;;
              docs\(*\)*|docs:*)
                DOCS="${DOCS}- ${desc} ${commit_url}\n"
                ;;
              style\(*\)*|style:*)
                STYLES="${STYLES}- ${desc} ${commit_url}\n"
                ;;
              test\(*\)*|test:*)
                TESTS="${TESTS}- ${desc} ${commit_url}\n"
                ;;
              build\(*\)*|build:*)
                BUILDS="${BUILDS}- ${desc} ${commit_url}\n"
                ;;
              ci\(*\)*|ci:*)
                CIS="${CIS}- ${desc} ${commit_url}\n"
                ;;
              chore\(*\)*|chore:*)
                CHORES="${CHORES}- ${desc} ${commit_url}\n"
                ;;
              *)
                OTHERS="${OTHERS}- ${subject} ${commit_url}\n"
                ;;
            esac
          done < <(git log $RANGE --format="%s|%h" 2>/dev/null | grep -v "^chore(release):")

          # 构建 Release Notes
          CHANGELOG="## What's Changed\n\n"

          [ -n "$FEATS" ] && CHANGELOG+="### ✨ Features\n\n${FEATS}"
          [ -n "$FIXES" ] && CHANGELOG+="### 🐛 Bug Fixes\n\n${FIXES}"
          [ -n "$PERFS" ] && CHANGELOG+="### ⚡ Performance\n\n${PERFS}"
          [ -n "$REFS" ] && CHANGELOG+="### 🔄 Refactoring\n\n${REFS}"
          [ -n "$DOCS" ] && CHANGELOG+="### 📝 Documentation\n\n${DOCS}"
          [ -n "$STYLES" ] && CHANGELOG+="### 💄 Styles\n\n${STYLES}"
          [ -n "$TESTS" ] && CHANGELOG+="### 🧪 Tests\n\n${TESTS}"
          [ -n "$BUILDS" ] && CHANGELOG+="### 📦 Build System\n\n${BUILDS}"
          [ -n "$CIS" ] && CHANGELOG+="### 🔧 CI/CD\n\n${CIS}"
          [ -n "$CHORES" ] && CHANGELOG+="### 🔧 Chores\n\n${CHORES}"
          [ -n "$OTHERS" ] && CHANGELOG+="### 📋 Other Changes\n\n${OTHERS}"

          # 检查是否有内容
          all_content="${FEATS}${FIXES}${PERFS}${REFS}${DOCS}${STYLES}${TESTS}${BUILDS}${CIS}${CHORES}${OTHERS}"
          [ -z "$all_content" ] && CHANGELOG+="- No functional changes in this release\n"

          CHANGELOG+="\n---\n\n**Full Changelog**: ${REPO_URL}/compare/${PREV_TAG}...v${CURRENT_TAG}"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.release-body.outputs.body }}
          files: |
            artifacts/windows/**/*.exe
            artifacts/linux/*.AppImage
            artifacts/macos/*.dmg
            artifacts/macos/*-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
