name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: ubuntu-latest
            target: --linux AppImage
            artifact: linux
          - os: macos-latest
            target: --mac
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libasound2t64 libxtst6 libayatana-appindicator3-dev \
            libdrm2 libgbm1 libxshmfence1 fakeroot rpm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: |
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/*-mac.zip
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Notes
        id: release-notes
        run: |
          set -euo pipefail
          shopt -s lastpipe

          CURRENT_TAG="${GITHUB_REF#refs/tags/v}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # 获取当前版本所有提交（排除版本发布提交）
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD^"
          else
            RANGE="HEAD"
          fi

          git log $RANGE --format="%s|%h" 2>/dev/null | \
            grep -v "^chore(release):" | \
            while IFS='|' read -r subject hash; do
              [ -z "$subject" ] && continue
              echo "${subject}|${hash}"
            done | \
          {
            IFS= read -rd '' COMMITS || true
            echo "COMMITS<<EOF"
            echo "${COMMITS:-}"
            echo "EOF"
          }

          # 输出版本信息
          echo "CURRENT_TAG=$CURRENT_TAG"
          echo "PREV_TAG=${PREV_TAG:-0.0.0}"

      - name: Generate Release Notes (Categorized)
        id: release-body
        run: |
          set -euo pipefail

          CURRENT_TAG="${{ steps.release-notes.outputs.CURRENT_TAG }}"
          PREV_TAG="${{ steps.release-notes.outputs.PREV_TAG }}"
          COMMITS="${{ steps.release-notes.outputs.COMMITS }}"

          REPO_URL="https://github.com/GuoSirius/video-analyst"

          # 初始化分组
          declare -A groups
          groups[feat]=""; groups[fix]=""; groups[perf]=""
          groups[refactor]=""; groups[docs]=""; groups[style]=""
          groups[test]=""; groups[build]=""; groups[ci]=""
          groups[chore]=""; groups[other]=""

          # 按类型分类提交
          while IFS='|' read -r subject hash; do
            [ -z "$subject" ] && continue
            commit_url="[\`${hash}\`](${REPO_URL}/commit/${hash})"
            desc="${subject#*:* }"

            if [[ "$subject" =~ ^feat(\(.+\))?: ]]; then
              groups[feat]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^fix(\(.+\))?: ]]; then
              groups[fix]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^perf(\(.+\))?: ]]; then
              groups[perf]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^refactor(\(.+\))?: ]]; then
              groups[refactor]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^docs(\(.+\))?: ]]; then
              groups[docs]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^style(\(.+\))?: ]]; then
              groups[style]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^test(\(.+\))?: ]]; then
              groups[test]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^build(\(.+\))?: ]]; then
              groups[build]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^ci(\(.+\))?: ]]; then
              groups[ci]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^chore(\(.+\))?: ]]; then
              groups[chore]+="- ${desc} ${commit_url}\n"
            else
              groups[other]+="- ${subject} ${commit_url}\n"
            fi
          done <<< "${COMMITS:-}"

          # 构建 Release Notes
          CHANGELOG="## What's Changed\n\n"

          add_section() {
            local key="$1"; local title="$2"
            [ -n "${groups[$key]}" ] && CHANGELOG+="### ${title}\n\n${groups[$key]}\n"
          }

          add_section "feat" "✨ Features"
          add_section "fix" "🐛 Bug Fixes"
          add_section "perf" "⚡ Performance"
          add_section "refactor" "🔄 Refactoring"
          add_section "docs" "📝 Documentation"
          add_section "style" "💄 Styles"
          add_section "test" "🧪 Tests"
          add_section "build" "📦 Build System"
          add_section "ci" "🔧 CI/CD"
          add_section "chore" "🔧 Chores"
          add_section "other" "📋 Other Changes"

          # 检查是否有内容
          all_content=""
          for key in feat fix perf refactor docs style test build ci chore other; do
            all_content+="${groups[$key]}"
          done

          if [ -z "$all_content" ]; then
            CHANGELOG+="- No functional changes in this release\n"
          fi

          CHANGELOG+="\n---\n\n**Full Changelog**: ${REPO_URL}/compare/${PREV_TAG}...v${CURRENT_TAG}"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.release-body.outputs.body }}
          files: |
            artifacts/windows/**/*.exe
            artifacts/linux/*.AppImage
            artifacts/macos/*.dmg
            artifacts/macos/*-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
