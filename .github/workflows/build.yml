name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: --win
            artifact_name: windows-installer
          - os: ubuntu-latest
            build_cmd: --linux AppImage
            artifact_name: linux-appimage
          - os: macos-latest
            build_cmd: --mac
            artifact_name: macos-dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            libayatana-appindicator3-dev \
            libdrm2 \
            libgbm1 \
            libxshmfence1 \
            fakeroot \
            rpm

      - name: Install dependencies
        run: |
          echo "=== npm install (skip postinstall) ===" && npm install --ignore-scripts

      - name: Install native deps
        run: npx electron-builder install-app-deps

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Build installers (macOS)
        if: matrix.os == 'macos-latest'
        # env:
        #   # CI 环境使用官方 electron-builder 镜像，避免 npmmirror 缺失文件
        #   ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        #   ELECTRON_BUILDER_BINARY_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npx electron-builder ${{ matrix.build_cmd }} --publish never

      - name: Build installers (others)
        if: matrix.os != 'macos-latest'
        run: npx electron-builder ${{ matrix.build_cmd }} --publish never

      - name: Debug - Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          echo "=== dist folder ===" && ls -la dist/ 2>&1 || echo "dist not found"
          echo "=== dist-electron folder ===" && ls -la dist-electron/ 2>&1 || echo "dist-electron not found"

      - name: Debug - Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "=== dist folder ===" && Get-ChildItem dist/ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          echo "=== dist-electron folder ===" && Get-ChildItem dist-electron/ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/*-mac.zip
            dist/*.tar.gz
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: ls -laR artifacts/

      - name: Generate Release Notes
        id: release-notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"
          CURRENT_TAG="${{ github.ref_name }}"
          REPO_URL="https://github.com/GuoSirius/video-analyst"

          # Generate changelog - exclude chore(release) commits, show only commits in this version
          if [ -n "$PREV_TAG" ]; then
            # Get commits between PREV_TAG and the commit before CURRENT_TAG (to exclude the release commit)
            COMMITS=$(git log ${PREV_TAG}..HEAD^ --pretty=format:"%s|%h" --grep="." --invert-grep --grep="chore(release)" 2>/dev/null)
          else
            COMMITS=$(git log --pretty=format:"%s|%h" | head -50)
          fi

          # Initialize type groups
          declare -A groups
          groups[feat]=""
          groups[fix]=""
          groups[perf]=""
          groups[refactor]=""
          groups[docs]=""
          groups[build]=""
          groups[ci]=""
          groups[chore]=""
          groups[other]=""

          # Parse commits and group by type
          while IFS='|' read -r subject hash; do
            [ -z "$subject" ] && continue
            commit_url="[${hash}](${REPO_URL}/commit/${hash})"
            
            if [[ "$subject" =~ ^feat(\(.+\))?: ]]; then
              desc="${subject#feat*:* }"
              groups[feat]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^fix(\(.+\))?: ]]; then
              desc="${subject#fix*:* }"
              groups[fix]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^perf(\(.+\))?: ]]; then
              desc="${subject#perf*:* }"
              groups[perf]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^refactor(\(.+\))?: ]]; then
              desc="${subject#refactor*:* }"
              groups[refactor]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^docs(\(.+\))?: ]]; then
              desc="${subject#docs*:* }"
              groups[docs]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^build(\(.+\))?: ]]; then
              desc="${subject#build*:* }"
              groups[build]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^ci(\(.+\))?: ]]; then
              desc="${subject#ci*:* }"
              groups[ci]+="- ${desc} ${commit_url}\n"
            elif [[ "$subject" =~ ^chore(\(.+\))?: ]]; then
              desc="${subject#chore*:* }"
              groups[chore]+="- ${desc} ${commit_url}\n"
            else
              groups[other]+="- ${subject} ${commit_url}\n"
            fi
          done <<< "$COMMITS"

          # Build changelog
          CHANGELOG="## What's Changed\n\n"

          # Helper function to add section
          add_section() {
            local key=$1
            local title=$2
            if [ -n "${groups[$key]}" ]; then
              CHANGELOG+="### ${title}\n\n"
              CHANGELOG+="${groups[$key]}\n"
            fi
          }

          add_section "feat" "✨ Features (新功能)"
          add_section "fix" "🐛 Bug Fixes (Bug 修复)"
          add_section "perf" "⚡ Performance Improvements (性能优化)"
          add_section "refactor" "🔄 Code Refactoring (重构)"
          add_section "docs" "📝 Documentation (文档)"
          add_section "build" "📦 Build System (构建)"
          add_section "ci" "🔧 CI/CD"
          add_section "chore" "🔧 Chores (其他更新)"
          add_section "other" "📋 Other Changes"

          # Check if there's any content
          if [ "${groups[feat]}${groups[fix]}${groups[perf]}${groups[refactor]}${groups[docs]}${groups[build]}${groups[ci]}${groups[chore]}${groups[other]}" == "" ]; then
            CHANGELOG+="- No functional changes in this release\n"
          fi

          CHANGELOG+="\n---\n\n**Full Changelog**: ${REPO_URL}/compare/${PREV_TAG:-0.0.0}...${CURRENT_TAG#v}"

          # Output as multiline string for GitHub Actions
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: ${{ steps.release-notes.outputs.changelog }}
          files: |
            artifacts/windows-installer/**/*.exe
            artifacts/linux-appimage/*.AppImage
            artifacts/macos-dmg/*.dmg
            artifacts/macos-dmg/*-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
