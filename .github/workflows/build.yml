name: Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Version Release']
    types: [completed]
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: nsis
            artifact_name: windows-installer
          - os: ubuntu-latest
            target: AppImage
            artifact_name: linux-appimage
          - os: macos-latest
            target: dmg
            artifact_name: macos-dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            libayatana-appindicator3-dev \
            libdrm2 \
            libgbm1 \
            libxshmfence1 \
            fakeroot \
            rpm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install native deps
        run: npx electron-builder install-app-deps

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Build installers
        run: npx electron-builder --${{ matrix.target }}

      - name: Debug - Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          echo "=== dist folder ===" && ls -la dist/ 2>&1 || echo "dist not found"
          echo "=== dist-electron folder ===" && ls -la dist-electron/ 2>&1 || echo "dist-electron not found"

      - name: Debug - Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "=== dist folder ===" && Get-ChildItem dist/ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          echo "=== dist-electron folder ===" && Get-ChildItem dist-electron/ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*
            dist-electron/*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          echo "=== artifacts folder ===" && ls -laR artifacts/

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo 'v1.0.0')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 自动构建

            Commit: `${{ github.sha }}`

            ### 变更说明
            ${{ github.event.head_commit.message }}

            ### 平台
            - Windows (NSIS)
            - Linux (AppImage)
            - macOS (DMG)
          draft: false
          prerelease: false
          files: |
            artifacts/**/windows-installer/**/*.exe
            artifacts/**/windows-installer/**/*.zip
            artifacts/**/linux-appimage/**/*.AppImage
            artifacts/**/macos-dmg/**/*.dmg
            artifacts/**/macos-dmg/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts:" >> $GITHUB_STEP_SUMMARY
          ls -laR artifacts/ >> $GITHUB_STEP_SUMMARY
