<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Play triangle (video symbol) -->
  <polygon points="192,140 192,372 368,256" fill="white" opacity="0.95"/>
  <!-- Analysis magnifying glass -->
  <circle cx="368" cy="340" r="64" fill="none" stroke="url(#accent)" stroke-width="18" opacity="0.9"/>
  <line x1="414" y1="386" x2="462" y2="434" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <!-- Small data dots inside magnifying glass -->
  <circle cx="348" cy="328" r="8" fill="white" opacity="0.8"/>
  <circle cx="372" cy="318" r="8" fill="white" opacity="0.6"/>
  <circle cx="388" cy="340" r="8" fill="white" opacity="0.7"/>
</svg>
